# Secrets are loaded from ../secrets.properties (git-ignored) or from environment variables
spring.config.import=optional:file:../secrets.properties

server.port=8081
spring.application.name=account-service

# H2 Database Config
spring.datasource.url=jdbc:h2:~/accountdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console Settings 
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Auto-create tables from your Java Entities
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET}


# RabbitMQ (Same as Customer Service)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# The Queue we will listen to
rabbitmq.queue.name=customer.registered.queue
rabbitmq.exchange.name=customer.exchange
rabbitmq.routing.key=customer.registered



# Eureka Client Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Help Eureka identify this instance
eureka.instance.prefer-ip-address=true

# Shared keys the gateway uses to prove a request came through it
gateway.keys.account=${GATEWAY_KEY_ACCOUNT}
gateway.keys.customer=${GATEWAY_KEY_CUSTOMER}
gateway.keys.card=${GATEWAY_KEY_CARD}
