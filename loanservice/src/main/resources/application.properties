# Secrets are loaded from ../secrets.properties (git-ignored) or from environment variables
spring.config.import=optional:file:../secrets.properties

spring.application.name=loanservice
server.port=8083

# H2 Database Config
spring.datasource.url=jdbc:h2:~/loandb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console Settings 
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Auto-create tables from your Java Entities
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# Custom JWT Secret Key
jwt.secret=${JWT_SECRET}

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# The name of the Exchange we will send messages to
rabbitmq.exchange.name=customer.exchange
rabbitmq.routing.key=loan.event


# Eureka Client Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Help Eureka identify this instance
eureka.instance.prefer-ip-address=true

# Shared keys the gateway uses to prove a request came through it
gateway.keys.loan=${GATEWAY_KEY_LOAN}
