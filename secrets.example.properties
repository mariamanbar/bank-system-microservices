# Copy this file to "secrets.properties" (same folder) and fill in real values.
# secrets.properties is git-ignored, so your real keys never get pushed.
# Every service reads it automatically. You can also set these as environment variables instead.

# Shared JWT signing key used by all services (at least 32 characters)
JWT_SECRET=CHANGE_ME_to_a_long_random_string_at_least_32_chars

# MongoDB Atlas connection string (used by loggerservice)
MONGODB_URI=mongodb+srv://USERNAME:PASSWORD@YOUR-CLUSTER.mongodb.net/?appName=Cluster0

# RabbitMQ (optional - defaults to guest/guest if not set)
RABBITMQ_USERNAME=guest
RABBITMQ_PASSWORD=guest

# Shared keys the API gateway sends to each service (any long random strings)
GATEWAY_KEY_ACCOUNT=CHANGE_ME
GATEWAY_KEY_CUSTOMER=CHANGE_ME
GATEWAY_KEY_CARD=CHANGE_ME
GATEWAY_KEY_LOAN=CHANGE_ME
GATEWAY_KEY_LOGGER=CHANGE_ME
GATEWAY_KEY_AUTH=CHANGE_ME
