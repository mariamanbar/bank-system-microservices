# Compiles every service on each push and pull request.
# Results show up in the repo's "Actions" tab (green tick = everything compiles).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  config:
    name: Check secrets template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every required secret is listed in secrets.example.properties
        run: |
          missing=0
          for name in $(grep -hoE '\$\{[A-Z0-9_]+\}' */src/main/resources/application*.properties | tr -d '${}' | sort -u); do
            if ! grep -q "^$name=" secrets.example.properties; then
              echo "::error::$name is used in a service config but missing from secrets.example.properties"
              missing=1
            fi
          done
          exit $missing

  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discoveryserver
          - apigateway-1
          - securityservice
          - customerservice
          - accountservice
          - cardservice
          - loanservice
          - loggerservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Compile and package
        working-directory: ${{ matrix.service }}
        # Tests are skipped: they start the full app, which needs RabbitMQ, MongoDB and real secrets.
        run: mvn -B -ntp -DskipTests package
