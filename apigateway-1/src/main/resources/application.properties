# Secrets are loaded from ../secrets.properties (git-ignored) or from environment variables
spring.config.import=optional:file:../secrets.properties

spring.application.name=apigateway-1
server.port=8084

# Eureka Client Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Routing Configuration
# Route for Account Service (e.g., http://localhost:8081/api/accounts/...)
spring.cloud.gateway.routes[0].id=account-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/accounts/**


management.endpoints.web.exposure.include=gateway
# In newer versions you might also need:
management.endpoint.gateway.enabled=true

# Shared keys the gateway uses to prove a request came through it
gateway.keys.account=${GATEWAY_KEY_ACCOUNT}
gateway.keys.customer=${GATEWAY_KEY_CUSTOMER}
gateway.keys.card=${GATEWAY_KEY_CARD}
gateway.keys.loan=${GATEWAY_KEY_LOAN}
gateway.keys.logger=${GATEWAY_KEY_LOGGER}
gateway.keys.auth=${GATEWAY_KEY_AUTH}
