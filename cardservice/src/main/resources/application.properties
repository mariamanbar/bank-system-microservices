# Secrets are loaded from ../secrets.properties (git-ignored) or from environment variables
spring.config.import=optional:file:../secrets.properties

spring.application.name=cardservice
server.port=8082

# H2 Database Config
spring.datasource.url=jdbc:h2:~/carddb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console Settings 
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Auto-create tables from your Java Entities
spring.jpa.hibernate.ddl-auto=update


# Eureka Client Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Help Eureka identify this instance
eureka.instance.prefer-ip-address=true

# Custom JWT Secret Key
jwt.secret=${JWT_SECRET}

# Shared keys the gateway uses to prove a request came through it
gateway.keys.card=${GATEWAY_KEY_CARD}
