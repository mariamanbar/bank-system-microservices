<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account | Mariam Bank</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312302a'/%3E%3Cpath d='M8 23V9.5l8 7.5 8-7.5V23' fill='none' stroke='%238fd0b8' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/core.js" defer></script>
  <script src="js/pages/register.js" defer></script>
</head>
<body class="auth-page">
  <div class="auth">
    <aside class="auth-side">
      <div>
        <div class="wordmark">Mariam<br>Bank</div>
        <p class="tagline">Open an account in a minute. You'll sign in with your email and password.</p>
      </div>
      <p class="credit">Built during an internship at Arab Bank.</p>
    </aside>
    <main class="auth-main">
      <form class="auth-form wide" id="registerForm" novalidate>
        <h1>Create an account</h1>
        <div class="form-error" id="registerError" role="alert" hidden></div>
        <div class="form-grid two">
          <label class="field span-2"><span>Full name</span><input class="input" id="regName" autocomplete="name" required autofocus></label>
          <label class="field span-2"><span>Email</span><input class="input" type="email" id="regEmail" autocomplete="email" required></label>
          <label class="field span-2"><span>Password</span><input class="input" type="password" id="regPassword" autocomplete="new-password" minlength="6" required><small>At least 6 characters.</small></label>
          <label class="field"><span>Date of birth</span><input class="input" type="date" id="regDob" required></label>
          <label class="field"><span>Phone</span><input class="input num" type="tel" id="regPhone" autocomplete="tel" placeholder="079…" required></label>
          <label class="field span-2"><span>National ID</span><input class="input num" id="regNatId" inputmode="numeric" required></label>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Create account</button>
        <p class="switch">Already have an account? <a href="login.html">Sign in</a></p>
      </form>
    </main>
  </div>
</body>
</html>
