<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mariam Bank - Sign Up</title>

    <link href="https://fonts.googleapis.com/css?family=Roboto:400,300,100,500,700,900" rel="stylesheet" type="text/css">
    <link href="assets/css/icons/icomoon/styles.css" rel="stylesheet" type="text/css">
    <link href="assets/css/bootstrap.css" rel="stylesheet" type="text/css">
    <link href="assets/css/core.css" rel="stylesheet" type="text/css">
    <link href="assets/css/components.css" rel="stylesheet" type="text/css">
    <link href="assets/css/colors.css" rel="stylesheet" type="text/css">

    <script type="text/javascript" src="assets/js/core/libraries/jquery.min.js"></script>
    <script type="text/javascript" src="assets/js/core/libraries/bootstrap.min.js"></script>
    <script type="text/javascript" src="assets/js/plugins/loaders/blockui.min.js"></script>
    <script type="text/javascript" src="assets/js/plugins/notifications/pnotify.min.js"></script>
    <script type="text/javascript" src="js/common.js"></script>
    <script type="text/javascript" src="js/demo.js"></script>
</head>

<body class="login-container">
    <div class="navbar navbar-inverse">
        <div class="navbar-header">
            <a class="navbar-brand" href="login.html"><img src="assets/images/logo_light.png" alt=""></a>
        </div>
        <div class="navbar-collapse collapse">
            <p class="navbar-text"><span class="label bg-success-400">SYSTEM ONLINE</span></p>
        </div>
    </div>

    <div class="page-container">
        <div class="page-content">
            <div class="content-wrapper">
                <div class="content">
                    <form id="registerForm">
                        <div class="panel panel-body login-form" style="width: 450px;">
                            <div class="text-center">
                                <div class="icon-object border-success text-success"><i class="icon-plus3"></i></div>
                                <h5 class="content-group">Create account <small class="display-block">All fields are required</small></h5>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group has-feedback has-feedback-left">
                                        <input type="text" id="reg_name" class="form-control" placeholder="Full Name" required>
                                        <div class="form-control-feedback"><i class="icon-user text-muted"></i></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group has-feedback has-feedback-left">
                                        <input type="email" id="reg_email" class="form-control" placeholder="Email" required>
                                        <div class="form-control-feedback"><i class="icon-mention text-muted"></i></div>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group has-feedback has-feedback-left">
                                        <input type="password" id="reg_password" class="form-control" placeholder="Create password" required>
                                        <div class="form-control-feedback"><i class="icon-user-lock text-muted"></i></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group has-feedback has-feedback-left">
                                        <input type="date" id="reg_dob" class="form-control" required>
                                        <div class="form-control-feedback"><i class="icon-calendar3 text-muted"></i></div>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group has-feedback has-feedback-left">
                                        <input type="text" id="reg_phone" class="form-control" placeholder="Phone (e.g. 079...)" required>
                                        <div class="form-control-feedback"><i class="icon-phone2 text-muted"></i></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group has-feedback has-feedback-left">
                                        <input type="text" id="reg_natId" class="form-control" placeholder="National ID" required>
                                        <div class="form-control-feedback"><i class="icon-vcard text-muted"></i></div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn bg-success btn-block">Register Account <i class="icon-circle-right2 position-right"></i></button>
                            </div>

                            <div class="content-divider text-muted form-group"><span>Already have an account?</span></div>
                            <a href="login.html" class="btn btn-default btn-block content-group">Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="js/pages/register.js"></script>
</body>
</html>
