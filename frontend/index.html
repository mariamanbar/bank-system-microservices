<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mariam Bank - Customer Management</title>

    <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,300,100,500,700,900"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="assets/css/icons/icomoon/styles.css"
      rel="stylesheet"
      type="text/css"
    />
    <link href="assets/css/bootstrap.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/core.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/components.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/colors.css" rel="stylesheet" type="text/css" />

    <script
      type="text/javascript"
      src="assets/js/core/libraries/jquery.min.js"
    ></script>
    <script
      type="text/javascript"
      src="assets/js/core/libraries/bootstrap.min.js"
    ></script>
    <script
      type="text/javascript"
      src="assets/js/plugins/loaders/blockui.min.js"
    ></script>
    <script
      type="text/javascript"
      src="assets/js/plugins/tables/datatables/datatables.min.js"
    ></script>
    <script
      type="text/javascript"
      src="assets/js/plugins/notifications/pnotify.min.js"
    ></script>
    <script type="text/javascript" src="assets/js/core/app.js"></script>
    <script type="text/javascript" src="js/common.js"></script>
    <script type="text/javascript" src="js/demo.js"></script>
    <script type="text/javascript" src="js/session.js"></script>
  </head>

  <body>
    <div class="navbar navbar-inverse">
      <div class="navbar-header">
        <a class="navbar-brand" href="index.html"
          ><img src="assets/images/logo_light.png" alt=""
        /></a>
        <ul class="nav navbar-nav visible-xs-block">
          <li>
            <a data-toggle="collapse" data-target="#navbar-mobile"
              ><i class="icon-tree5"></i
            ></a>
          </li>
          <li>
            <a class="sidebar-mobile-main-toggle"
              ><i class="icon-paragraph-justify3"></i
            ></a>
          </li>
        </ul>
      </div>
      <div class="navbar-collapse collapse" id="navbar-mobile">
        <ul class="nav navbar-nav">
          <li>
            <a class="sidebar-control sidebar-main-toggle hidden-xs"
              ><i class="icon-paragraph-justify3"></i
            ></a>
          </li>
        </ul>
        <p class="navbar-text">
          <span class="label bg-success-400">SYSTEM ONLINE</span>
        </p>
      </div>
    </div>

    <div class="page-container">
      <div class="page-content">
        <div class="sidebar sidebar-main">
          <div class="sidebar-content">
            <div class="sidebar-user">
              <div class="category-content">
                <div class="media">
                  <a href="#" class="media-left">
                    <img
                      src="assets/images/placeholder.jpg"
                      class="img-circle img-sm"
                      alt=""
                    />
                  </a>
                  <div class="media-body">
                    <span
                      class="media-heading text-semibold"
                      id="userNameDisplay"
                      >Mariam Anbar</span
                    >
                    <div class="text-size-mini text-muted">
                      <i class="icon-switch2 text-size-small"></i>
                      <a
                        href="javascript:void(0)"
                        onclick="logout()"
                        class="text-muted"
                        >Logout</a
                      >
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="sidebar-category sidebar-category-visible">
              <div class="category-content no-padding">
                <ul class="navigation navigation-main navigation-accordion">
                  <li class="navigation-header">
                    <span>Main</span> <i class="icon-menu"></i>
                  </li>
                  <li class="active">
                    <a href="index.html"
                      ><i class="icon-home4"></i>
                      <span>Customer Directory</span></a
                    >
                  </li>
                  <li>
                    <a href="accounts.html"
                      ><i class="icon-stack2"></i>
                      <span>Accounts Directory</span></a
                    >
                  </li>
                  <li>
                    <a href="cards.html"
                      ><i class="icon-credit-card"></i>
                      <span>Card Services</span></a
                    >
                  </li>
                  <li>
                    <a href="loans.html"
                      ><i class="icon-cash3"></i> <span>Loan System</span></a
                    >
                  </li>
                  <li class="navigation-header">
                    <span>Monitoring</span> <i class="icon-menu"></i>
                  </li>
                  <li>
                    <a href="logs.html"
                      ><i class="icon-list-ordered"></i>
                      <span>Transaction Logs</span></a
                    >
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <div class="content-wrapper">
          <div class="content">
            <div class="panel panel-flat">
              <div class="panel-heading">
                <h5 class="panel-title">Customer Directory</h5>
                <div class="heading-elements">
                  <button
                    type="button"
                    class="btn btn-primary btn-sm"
                    onclick="openRegisterModal()"
                  >
                    <i class="icon-plus3 position-left"></i> Register New Customer
                  </button>
                </div>
              </div>

              <table
                id="customersDT"
                class="table datatable-basic table-bordered table-striped"
              >
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>National ID</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Balance</th>
                    <th class="text-center">Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="modal_customer" class="modal fade">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal">
              &times;
            </button>
            <h5 class="modal-title" id="modalTitle">Customer Details</h5>
          </div>
          <form id="customerForm">
            <div class="modal-body">
              <input type="hidden" id="cust_id" />
              <div class="form-group">
                <label>Name:</label>
                <input
                  type="text"
                  id="cust_name"
                  class="form-control"
                  required
                />
              </div>
              <div class="form-group">
                <label>National ID:</label>
                <input
                  type="number"
                  id="cust_natId"
                  class="form-control"
                  required
                />
              </div>
              <div class="form-group">
                <label>Date Of Birth:</label>
                <input
                  type="date"
                  id="cust_dob"
                  class="form-control"
                  required
                />
              </div>
              <div class="form-group">
                <label>Phone:</label>
                <input
                  type="number"
                  id="cust_phone"
                  class="form-control"
                  required
                />
              </div>
              <div class="form-group">
                <label>Email:</label>
                <input
                  type="email"
                  id="cust_email"
                  class="form-control"
                  required
                />
              </div>
              <div id="passwordSection" class="form-group">
                <label>Password:</label>
                <input
                  type="password"
                  id="cust_password"
                  class="form-control"
                />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-link" data-dismiss="modal">
                Close
              </button>
              <button type="submit" class="btn btn-primary">
                Save changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="js/pages/customers.js"></script>
  </body>
</html>
