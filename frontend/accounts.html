<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accounts | Mariam Bank</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312302a'/%3E%3Cpath d='M8 23V9.5l8 7.5 8-7.5V23' fill='none' stroke='%238fd0b8' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/core.js" defer></script>
  <script src="js/table.js" defer></script>
  <script src="js/pages/accounts.js" defer></script>
</head>
<body data-page="accounts">
  <main class="main" id="main">
    <div class="page-head">
      <div>
        <h1 data-mine="My accounts">Accounts</h1>
      </div>
      <div class="page-actions" data-staff-only>
        <button type="button" class="btn btn-primary" id="openAccountBtn"><span data-icon="plus"></span>Open account</button>
      </div>
    </div>

    <div class="statement" id="statement" hidden>
      <div class="figure">
        <span class="label" id="totalLabel">Total balance</span>
        <span class="value" id="totalValue"></span>
      </div>
      <div class="figure small">
        <span class="label">Accounts</span>
        <span class="value" id="accountCountValue"></span>
      </div>
    </div>

    <section class="panel">
      <div class="toolbar">
        <label class="search">
          <span class="visually-hidden">Search accounts</span>
          <span data-icon="search"></span>
          <input class="input" type="search" id="accountSearch" placeholder="Search by account or customer ID">
        </label>
        <label>
          <span class="visually-hidden">Account type</span>
          <select class="select" id="typeFilter">
            <option value="">All types</option>
            <option value="CURRENT">Current</option>
            <option value="SAVINGS">Savings</option>
            <option value="SALARY">Salary</option>
            <option value="DEPOSIT">Deposit</option>
            <option value="LOAN">Loan</option>
          </select>
        </label>
        <span class="count" id="accountCount"></span>
      </div>
      <div class="table-wrap"><table class="ledger" id="accountsTable"><tbody></tbody></table></div>
    </section>
  </main>

  <dialog id="openAccountDialog" aria-labelledby="openAccountTitle">
    <form id="openAccountForm" novalidate>
      <div class="dialog-head">
        <div><h2 id="openAccountTitle">Open account</h2><p>The new account starts with a zero balance.</p></div>
        <button type="button" class="icon-btn" data-close aria-label="Close"><span data-icon="close"></span></button>
      </div>
      <div class="dialog-body">
        <div class="form-error" role="alert" hidden></div>
        <label class="field"><span>Customer ID</span><input class="input num" id="newAccCustomer" autocomplete="off" required><small>Find it on the Customers page.</small></label>
        <label class="field"><span>Account type</span>
          <select class="select" id="newAccType">
            <option value="CURRENT">Current</option>
            <option value="SAVINGS">Savings</option>
            <option value="SALARY">Salary</option>
            <option value="DEPOSIT">Deposit</option>
            <option value="LOAN">Loan</option>
          </select>
        </label>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Open account</button>
      </div>
    </form>
  </dialog>

  <dialog id="moneyDialog" aria-labelledby="moneyTitle">
    <form id="moneyForm" novalidate>
      <div class="dialog-head">
        <div><h2 id="moneyTitle">Deposit</h2><p id="moneyHint"></p></div>
        <button type="button" class="icon-btn" data-close aria-label="Close"><span data-icon="close"></span></button>
      </div>
      <div class="dialog-body">
        <div class="form-error" role="alert" hidden></div>
        <label class="field"><span>Amount ($)</span><input class="input num" type="number" id="moneyAmount" min="0.01" step="0.01" inputmode="decimal" required></label>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="moneySubmit">Deposit</button>
      </div>
    </form>
  </dialog>

  <dialog id="cardDialog" aria-labelledby="cardTitle">
    <form id="cardForm" novalidate>
      <div class="dialog-head">
        <div><h2 id="cardTitle">Request a card</h2><p id="cardHint"></p></div>
        <button type="button" class="icon-btn" data-close aria-label="Close"><span data-icon="close"></span></button>
      </div>
      <div class="dialog-body">
        <div class="form-error" role="alert" hidden></div>
        <label class="field"><span>Card network</span>
          <select class="select" id="cardType"><option value="VISA">Visa</option><option value="MASTERCARD">Mastercard</option></select>
        </label>
        <label class="field"><span>PIN</span><input class="input num" type="password" id="cardPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required><small>4 digits, used at ATMs and card machines.</small></label>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="cardSubmit">Request card</button>
      </div>
    </form>
  </dialog>
</body>
</html>
