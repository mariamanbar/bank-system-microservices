<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cards | Mariam Bank</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312302a'/%3E%3Cpath d='M8 23V9.5l8 7.5 8-7.5V23' fill='none' stroke='%238fd0b8' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/core.js" defer></script>
  <script src="js/table.js" defer></script>
  <script src="js/pages/cards.js" defer></script>
</head>
<body data-page="cards">
  <main class="main" id="main">
    <div class="page-head">
      <div>
        <h1 data-mine="My cards">Cards</h1>
        <p data-staff-only>New card requests arrive as pending. Change the status to activate or decline them.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn btn-primary" id="issueCardBtn"><span data-icon="plus"></span><span data-staff-only>Issue card</span><span data-customer-only>Request a card</span></button>
      </div>
    </div>

    <section class="panel">
      <div class="toolbar">
        <label class="search">
          <span class="visually-hidden">Search cards</span>
          <span data-icon="search"></span>
          <input class="input" type="search" id="cardSearch" placeholder="Search by card number or ID">
        </label>
        <label>
          <span class="visually-hidden">Status</span>
          <select class="select" id="statusFilter">
            <option value="">All statuses</option>
            <option value="ACTIVE">Active</option>
            <option value="PENDING">Pending</option>
            <option value="DECLINED">Declined</option>
          </select>
        </label>
        <span class="count" id="cardCount"></span>
      </div>
      <div class="table-wrap"><table class="ledger" id="cardsTable"><tbody></tbody></table></div>
    </section>
  </main>

  <dialog id="issueDialog" aria-labelledby="issueTitle">
    <form id="issueForm" novalidate>
      <div class="dialog-head">
        <div>
          <h2 id="issueTitle"><span data-staff-only>Issue card</span><span data-customer-only>Request a card</span></h2>
          <p>The card is linked to one account and starts as pending.</p>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close"><span data-icon="close"></span></button>
      </div>
      <div class="dialog-body">
        <div class="form-error" role="alert" hidden></div>
        <label class="field" data-staff-only><span>Account ID</span><input class="input num" id="issueAccountId" autocomplete="off"><small>Find it on the Accounts page.</small></label>
        <label class="field" data-customer-only><span>Account</span><select class="select" id="issueAccountSelect"></select></label>
        <label class="field"><span>Card network</span>
          <select class="select" id="issueType"><option value="VISA">Visa</option><option value="MASTERCARD">Mastercard</option></select>
        </label>
        <label class="field"><span>PIN</span><input class="input num" type="password" id="issuePin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required><small>4 digits.</small></label>
      </div>
      <div class="dialog-foot">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="issueSubmit"><span data-staff-only>Issue card</span><span data-customer-only>Request card</span></button>
      </div>
    </form>
  </dialog>

  <dialog id="pinDialog" aria-labelledby="pinTitle">
    <div class="dialog-head">
      <div><h2 id="pinTitle">Card PIN</h2><p id="pinHint"></p></div>
      <button type="button" class="icon-btn" data-close aria-label="Close"><span data-icon="close"></span></button>
    </div>
    <div class="dialog-body"><div class="pin-display" id="pinValue"></div></div>
    <div class="dialog-foot"><button type="button" class="btn btn-primary" data-close>Done</button></div>
  </dialog>
</body>
</html>
